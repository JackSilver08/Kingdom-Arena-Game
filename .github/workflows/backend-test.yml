name: Backend Tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-test.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test all backend packages
        run: go test ./...
      - name: Race-check game and room packages
        run: go test -race ./internal/game ./internal/room
      - name: Vet backend packages
        run: go vet ./...
      - name: Build server and simulation tool
        run: go build ./cmd/server ./cmd/sim